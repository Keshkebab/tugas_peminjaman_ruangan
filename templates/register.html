{% extends "base.html" %}
{% block title %}Daftar{% endblock %}

{% block content %}
<style>
  /* .form di style.css dirancang untuk <dialog> (lebar tetap + padding), jadi di-reset di sini */
  .auth .form { width: 100%; min-width: 0; max-width: 100%; padding: 0; box-sizing: border-box; }
  .auth .form input { width: 100%; box-sizing: border-box; }
  .auth .form-actions { justify-content: stretch; }
  .auth .form-actions .btn { width: 100%; }
</style>
<section class="card auth" style="max-width:26rem;margin:2rem auto">
  <h1>Daftar</h1>
  <form id="form" class="form">
    <label>Nama <input name="nama" maxlength="100" required></label>
    <label>Email <input type="email" name="email" maxlength="100" required></label>
    <label>Password <input type="password" name="password" minlength="6" maxlength="72" autocomplete="new-password" required></label>
    <label>No. HP (opsional) <input name="no_hp" maxlength="20"></label>
    <div class="form-actions"><button class="btn primary">Daftar</button></div>
  </form>
  <p class="sub">Sudah punya akun? <a href="/login">Masuk</a></p>
</section>
{% endblock %}

{% block scripts %}
<script>
$("#form").addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  guard(async () => {
    await api("/auth/register", { method: "POST", body: {
      nama: f.nama.value.trim(), email: f.email.value.trim(),
      password: f.password.value, no_hp: f.no_hp.value.trim() || null } });
    toast("Pendaftaran berhasil, silakan masuk");
    setTimeout(() => { location.href = "/login"; }, 800);
  });
});
</script>
{% endblock %}
