{% extends "base.html" %}
{% block title %}Masuk{% endblock %}

{% block content %}
<style>
  /* .form di style.css dirancang untuk <dialog> (lebar tetap + padding), jadi di-reset di sini */
  .auth .form { width: 100%; min-width: 0; max-width: 100%; padding: 0; box-sizing: border-box; }
  .auth .form input { width: 100%; box-sizing: border-box; }
  .auth .form-actions { justify-content: stretch; }
  .auth .form-actions .btn { width: 100%; }
</style>
<section class="card auth" style="max-width:26rem;margin:2rem auto">
  <h1>Masuk</h1>
  <form id="form" class="form">
    <label>Email <input type="email" name="email" maxlength="100" required></label>
    <label>Password <input type="password" name="password" required></label>
    <div class="form-actions"><button class="btn primary">Masuk</button></div>
  </form>
  <p class="sub">Belum punya akun? <a href="/register">Daftar</a></p>
</section>
{% endblock %}

{% block scripts %}
<script>
$("#form").addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  guard(async () => {
    await api("/auth/login", { method: "POST", body: { email: f.email.value.trim(), password: f.password.value } });
    location.href = "/";
  });
});
</script>
{% endblock %}
